<!doctype html> <!-- Tells the browser we are using html 5-->
<html> <!-- Start the html document-->

<head> <!-- Provide the header (meta) Information-->
    <title>Game</title> <!-- The title of the html page, as shown in the tab by the browser-->

    <!-- Cascading Style Sheets that define how to render elements in our page-->
    <style>
        /* Remove the margins and make sure we never show the scrollbars */
        * {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body> <!-- The main content in our browser window-->
    <canvas id="canv"> <!-- The canvas where we will draw our game -->

    </canvas>

    <!-- Include external js files, similar to Python import statements-->
    <script src="../../engine/Vector2.js"></script>
    <script src="../../engine/Input.js"></script>
    <script src="../../engine/Engine.js"></script>
    <script src="../../engine/Component.js"></script>
    <script src="../../engine/GameObject.js"></script>
    <script src="../../engine/Scene.js"></script>
    <script src="../../engine/SceneManager.js"></script>
    <script src="../../engine/Collisions.js"></script>

    <script src="../../engine/Time.js"></script>

    <script src="../../engine/components/Transform.js"></script>
    <script src="../../engine/components/Polygon.js"></script>
    <script src="../../engine/components/TextLabel.js"></script>
    <script src="../../engine/components/Camera.js"></script>
    <script src="../../engine/components/MultiLineTextLabel.js"></script>
    <script src="../../engine/components/Collider.js"></script>


    <!-- Game-Specific Components -->
    <script src="./components/SquareController.js"></script>

    <!-- Game-specific Game Objects -->
    <script src="./gameObjects/SquareGameObject.js"></script>
    <script src="./gameObjects/PlatformGameObject.js"></script>

    <!-- Game-specific Scenes -->
    <script src="./scenes/MainScene.js"></script>

    <script src="./Assets.js"></script>
    <script src="./Globals.js"></script>
    <script src="./Settings.js"></script>


    <!-- Our custom code for our game. In the future, all this code will be in individual js files-->
    <script>
        //Start the game engine
        //Every game we make will need to call this function.
        Engine.start(MainScene, Settings)

    </script>
</body>

</html>
